name: Release bridge bundles

on:
  push:
    tags:
      - "0.*"

permissions:
  contents: write

jobs:
  bridge:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Publish bridge
        run: dotnet publish bridge/Tandem.NodeApiSpike.Bridge.csproj -c Release -p:Version=${{ steps.version.outputs.VERSION }} -r osx-arm64 --self-contained false --output .runtime-publish

      - name: Stage allowlisted assets
        run: node scripts/stage-runtime.mjs

      - name: Package bridge bundle
        run: tar -czf tandem-bridge-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz -C bridge-runtime .

      - uses: actions/upload-artifact@v4
        with:
          name: tandem-bridge-${{ steps.version.outputs.VERSION }}-darwin-arm64
          path: ./tandem-bridge-${{ steps.version.outputs.VERSION }}-darwin-arm64.tar.gz

  release:
    needs: bridge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
