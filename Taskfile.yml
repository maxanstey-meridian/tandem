version: "3"

vars:
  SOLUTION: "{{.ROOT_DIR}}/Tandem.slnx"

tasks:
  build:
    cmds:
      - dotnet build {{.SOLUTION}}

  test:
    cmds:
      - dotnet test {{.SOLUTION}}

  package:test:
    cmds:
      - dotnet test {{.ROOT_DIR}}/tests/Tandem.PackageConsumer.Tests/Tandem.PackageConsumer.Tests.csproj --configuration Release

  # The analyzer pass loads the source generator from its build output, so build it first.
  generator:
    cmds:
      - dotnet build {{.ROOT_DIR}}/src/Tandem.Generators/Tandem.Generators.csproj

  format:
    cmds:
      - task: generator
      - dotnet tool restore
      - dotnet csharpier format .
      - dotnet format {{.SOLUTION}} analyzers --severity warn

  format:check:
    cmds:
      - task: generator
      - dotnet tool restore
      - dotnet csharpier check .
      - dotnet format {{.SOLUTION}} analyzers --severity warn --verify-no-changes --verbosity minimal

  check:
    cmds:
      - task: format:check
      - task: test
